# External Secrets Operator — HashiCorp Vault Integration
# Requirement 31.6: Barcha secretlarni faqat Vault orqali boshqarish
# Hardcoded secret yo'q — ExternalSecrets operator Vault dan sync qiladi
---
# ClusterSecretStore — Vault backend connection
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: edubridge
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    vault:
      server: "http://vault.edubridge-vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "edubridge-external-secrets"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "edubridge-production"
---
# ServiceAccount for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: edubridge-production
  labels:
    app.kubernetes.io/part-of: edubridge
    app.kubernetes.io/component: external-secrets
---
# ExternalSecret: Application secrets (JWT, API keys, etc.)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edubridge-app-secrets
  namespace: edubridge-production
  labels:
    app.kubernetes.io/part-of: edubridge
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: edubridge-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: edubridge
          security.edubridge.uz/managed-by: vault
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/data/edubridge/app
        property: jwt_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: secret/data/edubridge/app
        property: jwt_refresh_secret
    - secretKey: MASTER_KEY
      remoteRef:
        key: secret/data/edubridge/app
        property: master_key
    - secretKey: PAYME_MERCHANT_KEY
      remoteRef:
        key: secret/data/edubridge/app
        property: payme_merchant_key
    - secretKey: PAYME_MERCHANT_ID
      remoteRef:
        key: secret/data/edubridge/app
        property: payme_merchant_id
    - secretKey: CLAUDE_API_KEY
      remoteRef:
        key: secret/data/edubridge/app
        property: claude_api_key
    - secretKey: HCAPTCHA_SECRET
      remoteRef:
        key: secret/data/edubridge/app
        property: hcaptcha_secret
    - secretKey: BACKUP_ENCRYPTION_KEY
      remoteRef:
        key: secret/data/edubridge/app
        property: backup_encryption_key
---
# ExternalSecret: Database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edubridge-db-secrets
  namespace: edubridge-production
  labels:
    app.kubernetes.io/part-of: edubridge
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: edubridge-db-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@postgres-primary.edubridge-production.svc:5432/edubridge?sslmode=require"
  data:
    - secretKey: db_username
      remoteRef:
        key: secret/data/edubridge/database
        property: username
    - secretKey: db_password
      remoteRef:
        key: secret/data/edubridge/database
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: secret/data/edubridge/database
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: secret/data/edubridge/database
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: secret/data/edubridge/database
        property: name
---
