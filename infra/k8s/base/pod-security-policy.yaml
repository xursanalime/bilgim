      matchLabels:
        app.kubernetes.io/part-of: bilgim
---
# ValidatingAdmissionPolicy: Enforce seccomp profile
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bilgim-enforce-seccomp
  labels:
    app.kubernetes.io/part-of: bilgim
    security.bilgim.uz/policy: pss-restricted
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bilgim
  validations:
    - expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.seccompProfile) &&
        object.spec.securityContext.seccompProfile.type == "RuntimeDefault"
      message: "Pods must use RuntimeDefault seccomp profile (Req 31.9)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bilgim-enforce-seccomp-binding
  labels:
    app.kubernetes.io/part-of: bilgim
spec:
  policyName: bilgim-enforce-seccomp
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bilgim
