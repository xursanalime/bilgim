# Pod Security Standards — Restricted Profile Enforcement
# Requirement 31.9: Privileged container, host network, root user taqiqlash
#
# Note: PodSecurityPolicy is deprecated in K8s 1.25+.
# We use ValidatingAdmissionPolicy (K8s 1.30+) + namespace PSS labels
# for enforcement. This file provides additional Kyverno policies
# as defense-in-depth for clusters running Kyverno.
---
# ValidatingAdmissionPolicy: Block privileged containers
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bilgim-deny-privileged
  labels:
    app.kubernetes.io/part-of: bilgim
    security.bilgim.uz/policy: pss-restricted
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bilgim
  validations:
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          !has(c.securityContext) ||
          !has(c.securityContext.privileged) ||
          c.securityContext.privileged == false
        )
      message: "Privileged containers are not allowed in Bilgim namespaces (Req 31.9)"
    - expression: >-
        !has(object.spec.hostNetwork) || object.spec.hostNetwork == false
      message: "Host network access is not allowed in Bilgim namespaces (Req 31.9)"
    - expression: >-
        !has(object.spec.hostPID) || object.spec.hostPID == false
      message: "Host PID namespace is not allowed in Bilgim namespaces (Req 31.9)"
    - expression: >-
        !has(object.spec.hostIPC) || object.spec.hostIPC == false
      message: "Host IPC namespace is not allowed in Bilgim namespaces (Req 31.9)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bilgim-deny-privileged-binding
  labels:
    app.kubernetes.io/part-of: bilgim
spec:
  policyName: bilgim-deny-privileged
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bilgim
---
# ValidatingAdmissionPolicy: Enforce non-root user
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bilgim-enforce-nonroot
  labels:
    app.kubernetes.io/part-of: bilgim
    security.bilgim.uz/policy: pss-restricted
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bilgim
  validations:
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true
        )
      message: "All containers must run as non-root user (Req 31.9)"
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false
        )
      message: "Privilege escalation must be disabled (Req 31.9)"
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(cap, cap == "ALL")
        )
      message: "All capabilities must be dropped (Req 31.9)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bilgim-enforce-nonroot-binding
  labels:
    app.kubernetes.io/part-of: bilgim
spec:
  policyName: bilgim-enforce-nonroot
  validationActions:
    - Deny
    - Audit
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: bilgim
---
