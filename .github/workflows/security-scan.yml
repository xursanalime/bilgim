# Supply Chain Security Pipeline
# Validates: Requirements 31.1, 31.2, 31.3, 31.7, 31.8
#
# This workflow runs on every push to main and on PRs.
# It performs:
#   - Snyk dependency vulnerability scanning (Req 31.1)
#   - Trivy container image scanning (Req 31.2)
#   - cosign image signing via Sigstore (Req 31.3)
#   - SBOM generation in CycloneDX format (Req 31.7)
#
# Critical/High CVEs block deployment.

name: Supply Chain Security

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_WEB: ${{ github.repository }}/web
  NODE_VERSION: "20"
  PNPM_VERSION: "9.6.0"

permissions:
  contents: read
  packages: write
  id-token: write # Required for cosign keyless signing
  security-events: write # Required for uploading SARIF

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Snyk dependency scanning (Req 31.1)
  # ─────────────────────────────────────────────────────────────────
  snyk-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: false
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --severity-threshold=high
            --fail-on=upgradable
            --all-projects

      - name: Upload Snyk SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build container images
  # ─────────────────────────────────────────────────────────────────
  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      web-image: ${{ steps.meta-web.outputs.tags }}
      api-digest: ${{ steps.build-api.outputs.digest }}
      web-digest: ${{ steps.build-web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Extract metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        id: build-web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Trivy container image scanning (Req 31.2)
  # ─────────────────────────────────────────────────────────────────
  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/Dockerfile.api
          - image: web
            dockerfile: infra/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: scan-target:${{ matrix.image }}
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:${{ matrix.image }}
          format: "sarif"
          output: "trivy-${{ matrix.image }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1" # Fail on critical/high vulnerabilities

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Run Trivy (table output for logs)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:${{ matrix.image }}
          format: "table"
          severity: "CRITICAL,HIGH"

  # ─────────────────────────────────────────────────────────────────
  # Job 4: SBOM generation — CycloneDX format (Req 31.7)
  # ─────────────────────────────────────────────────────────────────
  sbom-generate:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/Dockerfile.api
          - image: web
            dockerfile: infra/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for SBOM
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: sbom-target:${{ matrix.image }}
          cache-from: type=gha

      - name: Generate SBOM with Syft (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: sbom-target:${{ matrix.image }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 90

      - name: Upload SBOM to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ matrix.image }}.cdx.json

  # ─────────────────────────────────────────────────────────────────
  # Job 5: cosign image signing — Sigstore keyless (Req 31.3)
  # ─────────────────────────────────────────────────────────────────
  sign-images:
    name: Sign Images (cosign)
    runs-on: ubuntu-latest
    needs: [build-images, trivy-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign API image
        run: |
          cosign sign --yes \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ needs.build-images.outputs.api-digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Sign Web image
        run: |
          cosign sign --yes \
            --rekor-url https://rekor.sigstore.dev \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}@${{ needs.build-images.outputs.web-digest }}
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Verify API image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}@${{ needs.build-images.outputs.api-digest }}

      - name: Verify Web image signature
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}@${{ needs.build-images.outputs.web-digest }}

  # ─────────────────────────────────────────────────────────────────
  # Job 6: Gate — blocks deployment if any security check fails
  # ─────────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [snyk-scan, trivy-scan, sign-images, sbom-generate]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          if [ "${{ needs.snyk-scan.result }}" == "failure" ]; then
            echo "::error::Snyk scan failed — critical/high CVEs detected in dependencies"
            exit 1
          fi
          if [ "${{ needs.trivy-scan.result }}" == "failure" ]; then
            echo "::error::Trivy scan failed — critical vulnerabilities in container images"
            exit 1
          fi
          if [ "${{ needs.sign-images.result }}" == "failure" ]; then
            echo "::error::Image signing failed — cannot deploy unsigned images"
            exit 1
          fi
          echo "✅ All security checks passed — deployment is allowed"
